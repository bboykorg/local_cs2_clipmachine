[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-clip-generator"
version = "1.0.0"
description = "Local CS2 highlight clip generator: demo -> highlights -> CS2 playback -> MP4"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.6,<7",
    "demoparser2>=0.42,<1",
    "pandas>=2.0",
    "cramjam>=2.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
obs = ["obsws-python>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.6"]

[project.scripts]
cs2clip = "cs2_clip_generator.cli:main"

[project.gui-scripts]
cs2-clip-generator = "cs2_clip_generator.app.main:main"

[tool.setuptools.packages.find]
include = ["cs2_clip_generator*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ANN", "C4", "N"]
ignore = [
    "ANN401",  # **kwargs: Any is fine for thin Qt wrappers
    "B008",    # Qt widgets are legitimately constructed in defaults
    "B027",    # optional hooks in ABCs are intentional, not oversights
    "S101",    # asserts are used in tests
    "S110",    # best-effort cleanup paths deliberately swallow errors
    "S112",
    "N818",    # Cancelled reads better than CancelledError next to AppError
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
